version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: bookstation_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount script để tạo bảng tự động
      - ./backend/sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - bookstation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    container_name: bookstation_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - bookstation-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  bookstation-network:
    driver: bridge