version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: bookstation_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount script để tạo bảng tự động
      - ./backend/sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - bookstation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    container_name: bookstation_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - bookstation-network
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstation_backend
    env_file:
      - .env
    ports:
      - "5074:8080"
    volumes:
      - ./backend/BookStation/BookStation.API/wwwroot/uploads:/app/wwwroot/uploads
    networks:
      - bookstation-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookstation_frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - BACKEND_URL=http://backend:8080
    networks:
      - bookstation-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bookstation-network:
    driver: bridge